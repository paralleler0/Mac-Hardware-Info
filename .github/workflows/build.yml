name: Build

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release Binary
        run: |
          cd "Mac Hardware Info"
          swift build -c release --arch arm64 --arch x86_64

      - name: Test
        run: |
          cd "Mac Hardware Info"
          .build/apple/Products/Release/macinfo
          
      - name: Save Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-hardware-info
          path: Mac Hardware Info/.build/apple/Products/Release/macinfo
