name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release Binary
        run: |
          cd "Mac Hardware Info"
          swift build -c release --arch arm64 --arch x86_64

      - name: Run Binary (test)
        run: .build/apple/Products/Release/macinfo
          
          
