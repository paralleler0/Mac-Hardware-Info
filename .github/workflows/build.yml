name: Build DMG

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Release App
        run: |
          xcodebuild \
            -scheme "Mac Hardware Info" \
            -configuration Release \
            -derivedDataPath build \
            build

      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R build/Build/Products/Release/*.app dmg/

          hdiutil create \
            -volname "Mac Hardware Info" \
            -srcfolder dmg \
            -ov -format UDZO \
            MacHardwareInfo.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MacHardwareInfo
          path: MacHardwareInfo.dmg
